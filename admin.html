<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HBML Admin Dashboard</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f7fc;
    margin:20px;
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    height:70px;
}

.logo h2{
    color:#0b2c5f;
    margin-top:10px;
}

.dashboard{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    margin-bottom:20px;
}

.card{
    background:#0b2c5f;
    color:#fff;
    flex:1;
    min-width:170px;
    padding:20px;
    text-align:center;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.card h3{
    color:#FFD700;
    font-size:30px;
    margin:0;
}

.card p{
    margin-top:8px;
}

#searchBox{
    width:100%;
    padding:12px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:6px;
    margin-bottom:15px;
}

.filters{
    margin-bottom:20px;
}

.filters button{
    padding:10px 16px;
    margin:5px;
    background:#0b2c5f;
    color:#fff;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.filters button:hover{
    background:#FFD700;
    color:#000;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
}

th{
    background:#0b2c5f;
    color:#fff;
    padding:12px;
}

td{
    padding:10px;
    border:1px solid #ddd;
    text-align:center;
}

tr:nth-child(even){
    background:#f9f9f9;
}

.approve-btn{
    background:green;
    color:white;
}

.reject-btn{
    background:red;
    color:white;
}

.delete-btn{
    background:#444;
    color:white;
}

button{
    padding:6px 12px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin:2px;
}

@media(max-width:768px){

.dashboard{
flex-direction:column;
}

table{
font-size:12px;
}

th,td{
padding:6px;
}

}

</style>

</head>

<body>

<div class="logo">
<img src="hbml-logo.png" alt="HBML Logo">
<h2>HBML Loan Applications</h2>
</div>

<div class="dashboard">

<div class="card">
<h3 id="totalApps">0</h3>
<p>Total Applications</p>
</div>

<div class="card">
<h3 id="pendingApps">0</h3>
<p>Pending</p>
</div>

<div class="card">
<h3 id="approvedApps">0</h3>
<p>Approved</p>
</div>

<div class="card">
<h3 id="rejectedApps">0</h3>
<p>Rejected</p>
</div>

</div>

<input
type="text"
id="searchBox"
placeholder="🔍 Search by Name or Mobile">

<div class="filters">

<button onclick="filterStatus('All')">All</button>

<button onclick="filterStatus('Pending')">Pending</button>

<button onclick="filterStatus('Approved')">Approved</button>

<button onclick="filterStatus('Rejected')">Rejected</button>
    
<button onclick="sortAmount('asc')">Amount ↑</button>

<button onclick="sortAmount('desc')">Amount ↓</button>

<button onclick="printApplications()">🖨 Print</button>
</div>

<table>

<thead>

<tr>
<th>Name</th>
<th>Mobile</th>
<th>Loan Type</th>
<th>Amount</th>
<th>Status</th>
<th>View</th>
<th>Action</th>
</tr>

</thead>

<tbody id="loanTable">

</tbody>

</table>

<script type="module" src="admin.js"></script>

</body>

</html>
