<!DOCTYPE html>
<html lang="en">
    <img src="hbml-logo.png" alt="HBML Capital Logo" height="60">
    <div style="text-align:center;margin-bottom:15px;">
    <img src="hbml-logo.png" alt="HBML Capital Logo" height="70">
    <h2>HBML Loan Applications</h2>
</div>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HBML Admin Dashboard</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f7fc;
    margin:20px;
}

h2{
    text-align:center;
    color:#0b2c5f;
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

th{
    background:#0b2c5f;
    color:#fff;
    padding:12px;
}

td{
    padding:10px;
    border:1px solid #ddd;
    text-align:center;
}

tr:nth-child(even){
    background:#f9f9f9;
}

button{
    padding:6px 12px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin:2px;
}

.approve{
    background:green;
    color:white;
}

.reject{
    background:red;
    color:white;
}

.delete{
    background:#444;
    color:white;
}

@media(max-width:768px){
    table{
        font-size:12px;
    }

    th,td{
        padding:6px;
    }

    button{
        padding:4px 8px;
        font-size:11px;
    }
}
    .card{
background:#0b2c5f;
color:white;
padding:20px;
border-radius:10px;
flex:1;
min-width:170px;
text-align:center;
box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.card h3{
font-size:30px;
margin:0;
color:#FFD700;
}

.card p{
margin-top:8px;
}
</style>

</head>

<body>

<h2>HBML Loan Applications</h2>
<div style="display:flex;flex-wrap:wrap;gap:15px;margin:20px 0;">

<div class="card">
<h3 id="totalApps">0</h3>
<p>Total Applications</p>
</div>

<div class="card">
<h3 id="pendingApps">0</h3>
<p>Pending</p>
</div>

<div class="card">
<h3 id="approvedApps">0</h3>
<p>Approved</p>
</div>

<div class="card">
<h3 id="rejectedApps">0</h3>
<p>Rejected</p>
</div>

</div>

<input
type="text"
id="searchBox"
placeholder="Search by Name or Mobile"
style="width:100%;padding:12px;font-size:16px;margin-bottom:15px;border:1px solid #ccc;border-radius:6px;">
<table>

<thead>
<tr>
<th>Name</th>
<th>Mobile</th>
<th>Loan Type</th>
<th>Amount</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="loanTable">

</tbody>

</table>

<script type="module" src="admin.js"></script>

</body>
</html>
