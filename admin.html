<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HBML Admin Dashboard</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f7fc;
    margin:20px;
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    height:70px;
}

.logo h2{
    color:#0b2c5f;
    margin-top:10px;
}

.dashboard{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    margin-bottom:20px;
}

.card{
    background:#0b2c5f;
    color:#fff;
    flex:1;
    min-width:170px;
    padding:20px;
    text-align:center;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.card h3{
    color:#FFD700;
    font-size:30px;
    margin:0;
}

.card p{
    margin-top:8px;
}

#searchBox{
    width:100%;
    padding:12px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:6px;
    margin-bottom:15px;
}

.filters{
    margin-bottom:20px;
}

.filters button{
    padding:10px 16px;
    margin:5px;
    background:#0b2c5f;
    color:#fff;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.filters button:hover{
    background:#FFD700;
    color:#000;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
}

th{
    background:#0b2c5f;
    color:#fff;
    padding:12px;
}

td{
    padding:10px;
    border:1px solid #ddd;
    text-align:center;
}

tr:nth-child(even){
    background:#f9f9f9;
}

.approve-btn{
    background:green;
    color:white;
}

.reject-btn{
    background:red;
    color:white;
}

.delete-btn{
    background:#444;
    color:white;
}

button{
    padding:6px 12px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin:2px;
}

@media screen and (max-width:768px){

.dashboard{
display:flex;
flex-direction:column;
}

table{
font-size:12px;
}

th,td{
padding:6px;
}

.filters button{
width:100%;
margin-top:8px;
}

.modal-content{
width:95%;
}

}

button{
padding:10px 18px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
transition:.3s;
}

button:hover{
transform:scale(1.05);
opacity:.9;
}

</style>

</head>

<body>

<div class="logo">
<img src="hbml-logo.png" alt="HBML Logo">
<h2>HBML Loan Applications</h2>
</div>
<div id="clock"></div>
    <h3 id="welcome"></h3>
<div class="dashboard">

<div class="card">
<h3 id="totalApps">0</h3>
<p>Total Applications</p>
</div>

<div class="card">
<h3 id="pendingApps">0</h3>
<p>Pending</p>
</div>

<div class="card">
<h3 id="approvedApps">0</h3>
<p>Approved</p>
</div>

<div class="card">
<h3 id="rejectedApps">0</h3>
<p>Rejected</p>
</div>

</div>

<input
type="text"
id="searchBox"
placeholder="🔍 Search by Name or Mobile">

<div class="filters">

<button onclick="filterStatus('All')">All</button>

<button onclick="filterStatus('Pending')">Pending</button>

<button onclick="filterStatus('Approved')">Approved</button>

<button onclick="filterStatus('Rejected')">Rejected</button>
    
<button onclick="sortAmount('asc')">Amount ↑</button>

<button onclick="sortAmount('desc')">Amount ↓</button>
<button onclick="printReport()">🖨 Print</button>
</div>

<table>

<thead>
<tr>
<th>Name</th>
<th>Mobile</th>
<th>Loan Type</th>
<th>Amount</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="loanTable">

</tbody>

</table>

<script type="module" src="admin.js"></script>
<!-- Customer Details Modal -->

<div id="customerModal" class="modal">

<div class="modal-content">
<span id="closeModal">&times;</span>

<h2>Loan Application Details</h2>
<div style="text-align:center;margin-bottom:15px;">

<img id="dPhoto"
src="https://via.placeholder.com/120"
width="120"
height="120"
style="border-radius:50%;border:3px solid #0b2c5f;">

</div>

<table class="detailTable">

<tr><td><b>Name</b></td><td id="dName"></td></tr>

<tr><td><b>Mobile</b></td><td id="dMobile"></td></tr>

<tr><td><b>Email</b></td><td id="dEmail"></td></tr>

<tr><td><b>Address</b></td><td id="dAddress"></td></tr>

<tr><td><b>Loan Type</b></td><td id="dLoan"></td></tr>

<tr><td><b>Loan Amount</b></td><td id="dAmount"></td></tr>

<tr><td><b>Occupation</b></td><td id="dOccupation"></td></tr>

<tr><td><b>Monthly Income</b></td><td id="dIncome"></td></tr>

<tr><td><b>Loan Purpose</b></td><td id="dPurpose"></td></tr>

<tr><td><b>Status</b></td><td id="dStatus"></td></tr>

<tr>
<td><b>Aadhaar</b></td>
<td>
<a id="aadhaarLink" href="#" target="_blank">
View Aadhaar
</a>
</td>
</tr>

<tr>
<td><b>PAN</b></td>
<td>
<a id="panLink" href="#" target="_blank">
View PAN
</a>
</td>
</tr>

</table>

<br><br>

<div style="text-align:center;">

<button id="approveLoanBtn">
✅ Approve Loan
</button>

<button id="rejectLoanBtn">
❌ Reject Loan
</button>

<button id="downloadAgreementBtn">
📄 Loan Agreement
</button>

<button id="printCustomerBtn" onclick="window.print()">
🖨 Print
</button>

<button id="closeCustomerBtn">
✖ Close
</button>

</div>
</div>

<footer id="footerText"></footer>
</body>

</html>
